name: Build guiaml

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup NDK r21e
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: true

      - name: ndk-build
        run: |
          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_OUT=./obj \
            NDK_LIBS_OUT=./libs \
            -j$(nproc)

      - name: Upload libguiaml.so
        uses: actions/upload-artifact@v4
        with:
          name: libguiaml-armeabi-v7a
          path: libs/armeabi-v7a/libguiaml.so
          if-no-files-found: error
